# tinycad native core for the e2e tests (M46, decision N72): scripts/e2e-core.mjs starts it as
# the Compose project tinycad-e2e-<E2E_PORT>, so every worktree (its own E2E_PORT) has its own
# containers. The documents live in a tmpfs: they vanish with `down`, and the e2e never sees the
# volume tinycad-data of docker-compose.yml (Pavel's documents). Envoy listens on E2E_CORE_PORT
# (default 18080); the `vite preview` of playwright.config.ts forwards /api there.

services:
  core:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: runtime
      args:
        # Several worktrees build at once on an 8 GB Docker VM (N116).
        CMAKE_BUILD_PARALLEL_LEVEL: '3'
    # A tag per port, so this build never replaces tinycad-core:dev or another worktree's image.
    image: tinycad-core:e2e-${E2E_PORT:-4173}
    expose:
      - '50051'
    environment:
      TINYCAD_DATA_DIR: /data
      TINYCAD_SESSION_IDLE_SECONDS: '600'
    volumes:
      # World-writable: the core runs as the non-root user tinycad (N103).
      - type: tmpfs
        target: /data
        tmpfs:
          size: 268435456
          mode: 01777
    stop_grace_period: 10s

  envoy:
    image: envoyproxy/envoy:v1.39.4
    command: ['envoy', '-c', '/etc/envoy/envoy.yaml', '--log-level', 'warn']
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - '127.0.0.1:${E2E_CORE_PORT:-18080}:8080'
    depends_on:
      - core
    healthcheck:
      # As in docker-compose.yml: Envoy's admin /ready over bash's /dev/tcp (no curl in the image).
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9901 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q LIVE <&3"
      interval: 2s
      timeout: 3s
      retries: 15
