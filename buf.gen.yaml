# TypeScript code of the tinycad protocol (spec 14, Q104, Q106): `npm run gen:proto` writes
# protobuf-es messages and service descriptors into src/protocol/tinycad/ (not in git). The C++
# side is generated by CMake inside the server build (N4), not here.
version: v2
inputs:
  - directory: server/proto
plugins:
  - local: protoc-gen-es
    out: src/protocol
    include_imports: false
    opt:
      - target=ts
      # tsconfig.base.json: moduleResolution bundler, so imports stay without an extension.
      - import_extension=none
      # tsconfig.base.json: erasableSyntaxOnly; enums become `as const` objects.
      - erasable_syntax=true
