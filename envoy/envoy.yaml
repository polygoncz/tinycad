# Envoy in front of tinycad-core (ADR 0030, spec 14): translates gRPC-Web from the browser to
# gRPC over HTTP/2, answers CORS for the Vite dev server, adds timeouts and checks the health of
# the core through grpc.health.v1. Listener :8080, admin :9901 (inside the Compose network).

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: grpc_web
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_web
                codec_type: AUTO
                # A WatchSession stream may stay open long; the per-route timeout governs calls.
                stream_idle_timeout: 300s
                route_config:
                  name: core
                  virtual_hosts:
                    - name: core
                      domains: ['*']
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - exact: http://localhost:5173
                            - exact: http://127.0.0.1:5173
                          allow_methods: GET, PUT, DELETE, POST, OPTIONS
                          allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,connect-protocol-version,connect-timeout-ms
                          expose_headers: grpc-status,grpc-message,grpc-status-details-bin
                          max_age: '1728000'
                      routes:
                        # WatchSession is a server stream for the whole session (spec 14): no
                        # route timeout (0s); the heartbeat every 30 s keeps it under
                        # stream_idle_timeout.
                        - match: { path: '/api/tinycad.v1.SessionService/WatchSession' }
                          route:
                            cluster: core
                            prefix_rewrite: '/tinycad.v1.SessionService/WatchSession'
                            timeout: 0s
                        - match: { path: '/tinycad.v1.SessionService/WatchSession' }
                          route:
                            cluster: core
                            timeout: 0s
                        # The Vite proxy forwards /api/<service>/<method>; the prefix is dropped.
                        - match: { prefix: '/api/' }
                          route:
                            cluster: core
                            prefix_rewrite: '/'
                            timeout: 30s
                        - match: { prefix: '/' }
                          route:
                            cluster: core
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: core
      type: STRICT_DNS
      connect_timeout: 2s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      load_assignment:
        cluster_name: core
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: core, port_value: 50051 }
