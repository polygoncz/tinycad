<!doctype html>
<!--
  Temporary dev page (M8, manual check of the viewport): open /dev/viewport.html on the dev server.
  Not part of the app. Remove or archive after M10.
-->
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tinycad – viewport dev</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 0.75rem;
        left: 0.75rem;
        width: 22rem;
        padding: 0.75rem;
        background: rgb(255 255 255 / 0.9);
        border: 1px solid #d0d4da;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      #panel button {
        margin: 0 0.25rem 0.25rem 0;
      }
      #events {
        margin: 0.5rem 0 0;
        font-size: 0.75rem;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel">
      <div id="views"></div>
      <p>
        <label
          >Height of box A (mm): <input id="height" type="number" min="1" step="1" disabled
        /></label>
      </p>
      <p id="status"></p>
      <p>Frames drawn: <strong id="frames">0</strong></p>
      <p>GPU: <strong id="memory">–</strong></p>
      <p>
        <label
          ><input id="overlay" type="checkbox" disabled /> Overlay (axes, rectangle above B)</label
        >
      </p>
      <p>Pick: <code id="pick">–</code></p>
      <p>Selection (left click, Shift adds/removes): <code id="selection">–</code></p>
      <div>Last events (newest first):</div>
      <pre id="events"></pre>
    </div>
    <script type="module" src="./viewport.ts"></script>
  </body>
</html>
